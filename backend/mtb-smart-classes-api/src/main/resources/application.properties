spring.application.name=mtb-smart-classes-api

server.port=8080

# =========================
# MySQL Database
# =========================
spring.datasource.url=jdbc:mysql://localhost:3306/mtb_smart_classes?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234

# Optional explicit driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA / Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================
# Actuator
# =========================
management.endpoints.web.exposure.include=health,info

# =========================
# JWT Configuration
# =========================

jwt.secret=${JWT_SECRET:mtb-smart-classes-local-dev-secret-change-before-production-2026}

jwt.expiration-ms=86400000




















